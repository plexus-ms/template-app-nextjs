_subdirectory: template

# The app's source and its marker are rendered at birth only: an update would fight what the author wrote,
# or add a root layout to an app whose route groups hold their own.
_exclude:
  - "{% if _copier_operation == 'update' %}src/app/layout.tsx{% endif %}"
  - "{% if _copier_operation == 'update' %}src/app/page.tsx{% endif %}"
  - "{% if _copier_operation == 'update' %}src/app/healthz/route.ts{% endif %}"
  - "{% if _copier_operation == 'update' %}PLEXUS.md{% endif %}"
_skip_if_exists:
  - src/app/layout.tsx
  - src/app/page.tsx
  - src/app/healthz/route.ts
  - PLEXUS.md

tenant:
  type: str
  help: "Tenant slug (URL-friendly)"
  placeholder: "acme-corp"
name:
  type: str
  help: "App name (for package.json)"
  placeholder: "@acme-corp/foo"
profile:
  type: str
  help: "The app's profile (§§ 8 and 9 PLX-App), which its marker states: stateless-app, an app holding no state of its own; stateful-app, an app with data services of its own, which gets a migrate service in its compose file and migrate and seed scripts to write"
  choices:
    - stateless-app
    - stateful-app
  default: stateless-app
